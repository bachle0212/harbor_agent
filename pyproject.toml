[project]
name = "harbor-kb"
version = "0.1.0"
description = "Support-doc ingest pipeline: scrape, normalize, delta-upload to a vector store."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "markdownify>=1.1.0",
  "google-genai>=1.40.0",
  "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
